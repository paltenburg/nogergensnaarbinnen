name: Geocoder regression tests

on:
  push:
    paths:
      - 'scripts/geocode.py'
      - 'tests/test_geocode.py'
      - '.github/workflows/geocode-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile geocoder and tests
        run: python -m py_compile scripts/geocode.py tests/test_geocode.py
      - name: Run offline geocoder regressions
        run: python -m unittest discover -s tests -p 'test_geocode.py' -v

name: nogergensnaarbinnen publiceren
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'scripts/geocode.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adressen op kaart plaatsen (PDOK)
        run: python scripts/geocode.py
      - name: Geocodes bewaren in masterdatabase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/venues.json data/geocode-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update gecontroleerde adrescoordinaten [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
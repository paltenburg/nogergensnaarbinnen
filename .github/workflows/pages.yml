name: nogergensnaarbinnen publiceren
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'scripts/geocode.py'
      - 'tests/**'
      - 'scripts/build_source_registry.py'
      - 'scripts/build_quality_report.py'
      - '.github/workflows/pages.yml'
  # Pushes immediately rebuild the Pages artifact without writing back to main.
  # A quiet scheduled run persists generated geocodes/source registers to git.
  schedule:
    - cron: '23 3 * * *' # 03:23 UTC, once per day
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer exacte BAG-adresmatching
        run: python -m unittest discover -s tests -v
      - name: Adressen op kaart plaatsen (PDOK)
        run: python scripts/geocode.py
      - name: Bronnenregister automatisch bijwerken
        run: python scripts/build_source_registry.py
      - name: Datakwaliteitsrapport per actieve regio genereren
        run: python scripts/build_quality_report.py
      # Never push from a push-triggered run: rapid venue commits made the
      # git branch advance during geocoding, causing repeated non-fast-forward
      # failures and noisy GitHub Actions emails. The freshly generated files
      # are still included in the Pages artifact on EVERY push.
      - name: Geocodes en bronnenregister terugschrijven (dagelijkse run)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Generated files can conflict with a previous publishing run or a
          # concurrent venue update. Rebuild against the latest main instead of
          # rebasing generated JSON/Markdown and risking merge conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              python scripts/geocode.py
              python scripts/build_source_registry.py
              python scripts/build_quality_report.py
            fi
            git add data/venues.json data/geocode-report.json data/source-register.json data/source-register.md data/quality-report.json
            if git diff --cached --quiet; then
              echo 'Generated data already current.'
              exit 0
            fi
            git commit -m 'Update gecontroleerde adrescoordinaten [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo 'Main advanced during maintenance; regenerating from latest main.'
              sleep 3
            fi
          done
          # Failure to save derived files is recoverable, not a publication
          # failure. Next night's run will retry; keep deploying the site.
          echo '::warning::Generated data could not be committed after five concurrent updates; will retry on the next maintenance run.'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
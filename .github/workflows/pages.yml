name: nogergensnaarbinnen publiceren
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'scripts/geocode.py'
      - 'tests/test_geocode.py'
      - 'scripts/build_source_registry.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer exacte BAG-adresmatching
        run: python -m unittest discover -s tests -v
      - name: Adressen op kaart plaatsen (PDOK)
        run: python scripts/geocode.py
      - name: Bronnenregister automatisch bijwerken
        run: python scripts/build_source_registry.py
      - name: Geocodes en bronnenregister bewaren in masterdatabase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Generated files can conflict with a previous publishing run or a
          # concurrent venue update. Rebuild against the latest main instead of
          # rebasing generated JSON/Markdown and risking merge conflicts.
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              python scripts/geocode.py
              python scripts/build_source_registry.py
            fi
            git add data/venues.json data/geocode-report.json data/source-register.json data/source-register.md
            if git diff --cached --quiet; then
              echo 'Generated data already current.'
              break
            fi
            git commit -m 'Update gecontroleerde adrescoordinaten [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Could not publish generated data after three attempts.' >&2
              exit 1
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
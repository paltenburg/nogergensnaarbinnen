name: Controleer ontbrekende Utrechtse horeca in OSM
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_osm_venues.py'
      - '.github/workflows/osm-audit.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vergelijk open OSM-data met gezaghebbende venues.json
        run: python scripts/audit_osm_venues.py
      - name: Publiceer uitsluitend auditrapport (niet venues.json)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/osm-audit-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh OSM candidate review report [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
